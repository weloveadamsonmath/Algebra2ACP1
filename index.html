<style>
/* Layout: a drafting sheet. A sticky index of topics down the left (a strip on phones), one working
   column on vellum, square-cornered panels with thin graphite rules, construction-blue arcs and
   dimension lines as the only ornament. Dark mode is a blueprint. */
:root {
  --paper: #F3F4F0; --sheet: #FFFFFF; --ink: #1C2126; --ink-2: #47515A; --muted: #6A737B;
  --rule: #D6DAD3; --rule-2: #B7BDB5; --dot: #CBD0C8;
  --npb: #2A84BD; --npb-soft: #E4F1F8; --npb-ink: #1D6697;
  --btn: #1C2126; --on-btn: #FFFFFF;
  --flag: #C98207; --flag-soft: #FBF0D9;
  --c-coord: #1E63A6; --c-logic: #9C3A6E; --c-proof: #2C7A4B; --c-fig: #B0560F;
  --ok: #1E7A4C; --ok-soft: #E1F2E8; --bad: #C0321F; --bad-soft: #FBE8E4;
  --fill0: rgba(42, 132, 189, .13); --fill1: rgba(156, 58, 110, .13); --fill2: rgba(44, 122, 75, .15);
  --f-display: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F2C48; --sheet: #13385B; --ink: #EAF2FA; --ink-2: #C0D4E7; --muted: #8FAAC3;
  --rule: #2A5276; --rule-2: #3B678F; --dot: #22476B;
  --npb: #8DD1F3; --npb-soft: rgba(141, 209, 243, .14); --npb-ink: #A9DDF7;
  --btn: #EAF2FA; --on-btn: #0F2C48;
  --flag: #FFC857; --flag-soft: rgba(255, 200, 87, .16);
  --c-coord: #8FC3FF; --c-logic: #F1A7CF; --c-proof: #8EDFAF; --c-fig: #FFBF7A;
  --ok: #82DEAA; --ok-soft: rgba(130, 222, 170, .15); --bad: #FF8F80; --bad-soft: rgba(255, 143, 128, .15);
  --fill0: rgba(141, 209, 243, .16); --fill1: rgba(241, 167, 207, .16); --fill2: rgba(142, 223, 175, .16);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0F2C48; --sheet: #13385B; --ink: #EAF2FA; --ink-2: #C0D4E7; --muted: #8FAAC3;
  --rule: #2A5276; --rule-2: #3B678F; --dot: #22476B;
  --npb: #8DD1F3; --npb-soft: rgba(141, 209, 243, .14); --npb-ink: #A9DDF7;
  --btn: #EAF2FA; --on-btn: #0F2C48;
  --flag: #FFC857; --flag-soft: rgba(255, 200, 87, .16);
  --c-coord: #8FC3FF; --c-logic: #F1A7CF; --c-proof: #8EDFAF; --c-fig: #FFBF7A;
  --ok: #82DEAA; --ok-soft: rgba(130, 222, 170, .15); --bad: #FF8F80; --bad-soft: rgba(255, 143, 128, .15);
  --fill0: rgba(141, 209, 243, .16); --fill1: rgba(241, 167, 207, .16); --fill2: rgba(142, 223, 175, .16);
  color-scheme: dark; }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { font-size: 100%; }
body { margin: 0; background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--npb); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0 0 .75rem; }
.fine { font-size: .92rem; color: var(--ink-2); }
.center { text-align: center; }
.eyebrow, .lbl { font-family: var(--f-mono); font-weight: 500; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }

/* shell: side index + main column */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1.5px solid var(--ink); }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .55rem max(16px, env(safe-area-inset-right, 0px)) .55rem max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: .6rem; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand svg { width: 2.1rem; height: 2.1rem; flex: none; }
.brand svg .bt { fill: var(--fill0); stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.brand svg .ba { fill: none; stroke: var(--npb); stroke-width: 1.6; stroke-dasharray: 2.5 3; }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; line-height: 1.05; letter-spacing: .01em; }
.brand-t small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mixbtn { flex: none; display: inline-flex; align-items: center; gap: .5rem; border: 1.5px solid var(--ink); background: var(--btn); color: var(--on-btn); font-weight: 600; font-size: .92rem; padding: .45rem .85rem; cursor: pointer; border-radius: 2px; }
.mixbtn::before { content: ""; width: .5rem; height: .5rem; border: 1.5px solid currentColor; transform: rotate(45deg); }
.mixbtn[aria-current="page"] { box-shadow: 3px 3px 0 var(--npb); }
.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--rule); padding: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
.tabs::-webkit-scrollbar { display: none; }
.grp { display: none; }
.tab { flex: none; display: inline-flex; align-items: baseline; gap: .4rem; white-space: nowrap; background: none; border: 0; border-bottom: 3px solid transparent; padding: .5rem .6rem .4rem; font-size: .88rem; font-weight: 500; color: var(--ink-2); cursor: pointer; text-align: left; }
.tab .n { font-family: var(--f-mono); font-weight: 600; font-size: .78rem; color: var(--muted); }
.tab .tck { color: var(--ok); font-weight: 700; font-size: .8rem; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab.c-coord .n { color: var(--c-coord); } .tab.c-logic .n { color: var(--c-logic); } .tab.c-proof .n { color: var(--c-proof); } .tab.c-fig .n { color: var(--c-fig); }
.tab.home { position: sticky; left: 0; z-index: 1; background: var(--sheet); align-items: center; gap: .45rem; font-weight: 700; font-size: .95rem; color: var(--ink); border-right: 1px solid var(--rule); padding-right: .85rem; margin-right: .25rem; }
.hico { width: 1.15rem; height: 1.15rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.tab.home[aria-current="page"] .hico { fill: var(--npb-soft); }
.main { min-width: 0; }
.wrap { max-width: 50rem; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 1000px) {
  .shell { grid-template-columns: 16.5rem minmax(0, 1fr); }
  .side { height: 100vh; overflow-y: auto; border-bottom: 0; border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; }
  .side-top { flex-direction: column; align-items: stretch; gap: .9rem; padding: 1.25rem 1.1rem 1rem; border-bottom: 1px solid var(--rule); }
  .mixbtn { justify-content: center; padding: .6rem .85rem; }
  .tabs { flex-direction: column; overflow: visible; border-top: 0; padding: .5rem 0 1.5rem; }
  .grp { display: block; margin: .9rem 1.1rem .25rem; font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .grp::before { content: ""; display: inline-block; width: .55rem; height: .55rem; margin-right: .45rem; vertical-align: -.02em; background: currentColor; }
  .grp.c-coord::before { background: var(--c-coord); } .grp.c-logic::before { background: var(--c-logic); } .grp.c-proof::before { background: var(--c-proof); } .grp.c-fig::before { background: var(--c-fig); }
  .tab { border-bottom: 0; border-left: 3px solid transparent; padding: .38rem 1.1rem .38rem .95rem; white-space: normal; }
  .tab .n { min-width: 2.1rem; }
  .tab[aria-current="page"] { border-left-color: var(--ink); background: var(--npb-soft); }
  .tab.home { position: static; margin: .35rem 1.1rem .4rem; padding: .55rem .85rem; gap: .6rem; font-size: 1rem; border: 1.5px solid var(--ink); background: var(--sheet); }
  .tab.home:hover { background: var(--npb-soft); }
  .tab.home[aria-current="page"] { border-left-color: var(--ink); background: var(--npb-soft); box-shadow: 3px 3px 0 var(--npb); }
  .wrap { padding-left: 2.5rem; padding-right: 2.5rem; }
}

/* buttons */
.btn { display: inline-flex; align-items: center; gap: .55rem; justify-content: center; font-weight: 600; font-size: 1rem; line-height: 1.1; padding: .75rem 1.15rem; min-height: 2.85rem; border-radius: 2px; border: 1.5px solid var(--ink); cursor: pointer; text-align: center; transition: transform .08s ease, box-shadow .12s ease; }
.btn:active:not(:disabled) { transform: translate(1px, 1px); }
.btn.primary { background: var(--btn); color: var(--on-btn); box-shadow: 3px 3px 0 var(--npb); }
.btn.primary:hover:not(:disabled) { box-shadow: 4px 4px 0 var(--npb); }
.btn.ghost { background: var(--sheet); color: var(--ink); }
.btn.ghost:hover:not(:disabled) { background: var(--npb-soft); }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.btn.sm { min-height: 2.3rem; padding: .5rem .85rem; font-size: .9rem; }
.btn .cnt { font-family: var(--f-mono); font-weight: 500; font-size: .76em; padding-left: .55rem; border-left: 1px solid currentColor; opacity: .85; }
.linkbtn { background: none; border: 0; color: var(--npb-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .9rem; padding: .3rem .2rem; }

/* math */
.m { white-space: nowrap; font-variant-numeric: lining-nums; }
.m i { font-style: italic; padding-right: .05em; }
.m sup { font-size: .68em; line-height: 0; position: relative; top: -.1em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.15; margin: 0 .12em; }
.fr .nu { border-bottom: .09em solid currentColor; padding: 0 .2em .05em; }
.fr .de { padding: .05em .2em 0; }
.m .fn { font-style: normal; }
.ov { border-top: .085em solid currentColor; padding-top: .02em; display: inline-block; line-height: 1.1; }
.ln-ov { position: relative; display: inline-block; line-height: 1.1; padding: .3em .14em 0; }
.ln-ov::before { content: ""; position: absolute; left: .12em; right: .12em; top: .2em; border-top: .08em solid currentColor; }
.ln-ov .lh, .ln-ov .rh { position: absolute; top: .09em; width: 0; height: 0; border-top: .15em solid transparent; border-bottom: .15em solid transparent; }
.ln-ov .lh { left: 0; border-right: .24em solid currentColor; }
.ln-ov .rh { right: 0; border-left: .24em solid currentColor; }
.rt { display: inline-flex; align-items: flex-start; }
.rad { border-top: .08em solid currentColor; padding: .05em .12em 0 .06em; margin-top: .08em; }
.tick { color: var(--ok); font-weight: 700; }

/* section heads: a short dimension line before the label */
.sec { margin-block: 2.6rem 1rem; }
.sec h2 { display: flex; align-items: center; gap: .7rem; font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; line-height: 1.15; margin: 0; }
.sec h2::before { content: ""; flex: none; width: 1.6rem; height: 9px; border-left: 1.5px solid var(--npb); border-right: 1.5px solid var(--npb); background: linear-gradient(var(--npb), var(--npb)) center / 100% 1.5px no-repeat; }
.sec > p { margin-top: .5rem; }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; align-items: center; margin-block: 1.75rem 1rem; padding: 1.5rem 1.4rem; background: var(--sheet); border: 1.5px solid var(--ink); position: relative; }
.hero::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--rule); pointer-events: none; }
.hero > * { position: relative; z-index: 1; min-width: 0; }
@media (min-width: 760px) { .hero { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); padding: 2.2rem 2rem; } }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.4rem, 7.5vw, 3.9rem); line-height: .98; letter-spacing: -.01em; margin: .25rem 0 .2rem; }
.dimline { display: flex; align-items: center; gap: .5rem; margin: .7rem 0 1rem; color: var(--npb-ink); font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; max-width: 26rem; }
.dimline::before, .dimline::after { content: ""; flex: 1; height: 9px; background: linear-gradient(currentColor, currentColor) center / 100% 1.5px no-repeat; }
.dimline::before { border-left: 1.5px solid currentColor; } .dimline::after { border-right: 1.5px solid currentColor; }
.lede { font-size: 1.1rem; color: var(--ink-2); max-width: 34rem; }
.hero-row { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.1rem; }
.hero-fig svg { display: block; width: 100%; max-width: 19rem; margin: 0 auto; height: auto; }
@media (max-width: 759px) { .hero-fig svg { max-width: 13rem; } }
.hero-fig .c { fill: none; stroke: var(--npb); stroke-width: 1.4; stroke-dasharray: 3 4; }
.hero-fig .t { fill: var(--fill0); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
.hero-fig .d { stroke: var(--npb); stroke-width: 1.4; fill: none; }
.hero-fig .p { fill: var(--ink); }
.hero-fig .k { stroke: var(--ink); stroke-width: 1.6; }
.hero-fig text { font-family: var(--f-mono); font-size: 13px; fill: var(--ink); }
.hero-fig text.dl { fill: var(--npb-ink); font-size: 11px; letter-spacing: .06em; }
.progress { margin-top: 1.2rem; max-width: 26rem; }
.progress .lbl { display: flex; justify-content: space-between; margin-bottom: .3rem; }
.pbar { height: .55rem; border: 1px solid var(--ink); background: var(--sheet); }
.pbar i { display: block; height: 100%; background: var(--ink); }
.spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0; border: 1.5px solid var(--ink); background: var(--sheet); margin: 0; }
.spec div { padding: .8rem 1rem; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 -1px -1px 0; }
.spec dt { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.spec dd { margin: .1rem 0 0; font-weight: 600; }
.spec dd span { display: block; font-weight: 400; font-size: .93rem; color: var(--ink-2); }
.scale { display: flex; border: 1.5px solid var(--ink); height: 1.6rem; max-width: 40rem; }
.scale i { flex: 1; border-right: 1px solid var(--sheet); }
.scale i:last-child { border-right: 0; }
.scale .c-coord, .key .c-coord { background: var(--c-coord); } .scale .c-logic, .key .c-logic { background: var(--c-logic); }
.scale .c-proof, .key .c-proof { background: var(--c-proof); } .scale .c-fig, .key .c-fig { background: var(--c-fig); }
.scale-n { display: flex; justify-content: space-between; max-width: 40rem; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); margin-top: .2rem; }
.key { list-style: none; display: flex; flex-wrap: wrap; gap: .35rem 1.3rem; padding: 0; margin: .8rem 0 0; font-size: .95rem; color: var(--ink-2); }
.key i { display: inline-block; width: .8rem; height: .8rem; margin-right: .45rem; vertical-align: -.05em; }
.key b { font-family: var(--f-mono); color: var(--ink); margin-right: .2rem; }
.index { border-top: 1.5px solid var(--ink); }
.irow { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: .2rem 1rem; align-items: center; padding: .85rem .2rem; border-bottom: 1px solid var(--rule); }
.code { font-family: var(--f-mono); font-weight: 600; font-size: .9rem; text-align: center; padding: .3rem 0; border: 1.5px solid currentColor; }
.code.c-coord { color: var(--c-coord); } .code.c-logic { color: var(--c-logic); } .code.c-proof { color: var(--c-proof); } .code.c-fig { color: var(--c-fig); }
.code.mx { color: var(--ink); background: var(--npb-soft); }
.ititle { justify-self: start; background: none; border: 0; padding: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.18rem; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 4px; }
.ititle:hover { text-decoration-color: var(--npb); }
.inote { grid-column: 2; font-size: .9rem; color: var(--ink-2); }
.iside { grid-row: 1 / span 2; grid-column: 3; display: grid; justify-items: end; gap: .3rem; }
.qtag { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { .irow { grid-template-columns: 2.8rem minmax(0, 1fr); } .iside { grid-row: auto; grid-column: 2; justify-items: start; grid-auto-flow: column; align-items: center; gap: .6rem; } }
.sq { display: inline-flex; gap: 2px; vertical-align: middle; }
.sq i { width: .6rem; height: .6rem; border: 1px solid var(--rule-2); background: var(--sheet); }
.sq i.on { background: var(--ok); border-color: var(--ok); }
.lastmk { font-family: var(--f-mono); font-size: .72rem; padding: .05rem .4rem; border: 1px solid var(--rule-2); color: var(--muted); white-space: nowrap; }
.lastmk.ok { color: var(--ok); border-color: var(--ok); } .lastmk.no { color: var(--bad); border-color: var(--bad); } .lastmk.mid { color: var(--flag); border-color: var(--flag); }
.habits { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); border: 1.5px solid var(--ink); background: var(--sheet); }
.habits li { padding: 1rem 1.1rem; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 -1px -1px 0; }
.habits h3 { margin: 0 0 .25rem; font-size: 1.02rem; display: flex; gap: .5rem; align-items: baseline; }
.habits h3::before { content: ""; flex: none; width: 0; height: 0; border-left: .38rem solid transparent; border-right: .38rem solid transparent; border-bottom: .62rem solid var(--npb); }
.habits p { margin: 0; color: var(--ink-2); font-size: .96rem; }
.teacher { margin-block: 2.5rem; border: 1px dashed var(--rule-2); padding: .9rem 1.1rem; background: var(--sheet); }
.teacher summary { cursor: pointer; font-weight: 600; }
.teacher ul { margin: .75rem 0 0; padding-left: 1.2rem; display: grid; gap: .45rem; color: var(--ink-2); font-size: .95rem; }
.teacher .cover { margin-top: 1rem; border-top: 1px solid var(--rule); padding-top: .75rem; }
.teacher .cov { margin-top: .9rem; }
.teacher .cov-h { margin: 0; font-weight: 600; display: flex; gap: .5rem; align-items: baseline; }
.teacher .cov ul { margin-top: .35rem; gap: .25rem; font-size: .9rem; }
.teacher code { font-family: var(--f-mono); font-size: .85em; background: var(--paper); padding: .05rem .3rem; overflow-wrap: anywhere; }
.reset { text-align: center; margin-block: 1rem 3rem; display: grid; justify-items: center; gap: .5rem; }
.reset p { margin: 0; }
.reset-row { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
.erased { color: var(--ok); font-weight: 600; }

/* topic pages */
.mod-head { padding-block: 1.9rem .4rem; }
.mod-head h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.9rem); line-height: 1.02; margin: .1rem 0 .7rem; letter-spacing: -.005em; }
.why { font-size: 1.07rem; color: var(--ink-2); max-width: 40rem; }
.seg { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; margin-top: 1rem; border-bottom: 1.5px solid var(--ink); }
.seg button { display: inline-flex; align-items: center; gap: .55rem; padding: .6rem 1.1rem; font-weight: 600; font-size: 1.02rem; cursor: pointer; border: 1.5px solid transparent; border-bottom: 0; background: none; color: var(--ink-2); margin-bottom: -1.5px; }
.seg button[aria-selected="true"] { border-color: var(--ink); background: var(--sheet); color: var(--ink); }
.seg button.fcin { margin-left: auto; font-size: .9rem; font-weight: 500; color: var(--npb-ink); }
.seg-n { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); }

function answered(p, a) {
  if (a == null) return false;
  if (p.type === 'mc') return a !== null && a !== undefined;
  if (p.type === 'multi') return Array.isArray(a) && a.length > 0;
  if (p.type === 'num') return String(a).trim() !== '' && parseNum(a) !== null;
  if (p.type === 'match') return Array.isArray(a) && a.length === p.rows.length && a.every(v => v >= 0);
  if (p.type === 'plot') return Array.isArray(a) && a.length === p.plot.n;
  return false;
}
function parseNum(s) {
  s = String(s).trim().replace(/[\u2212\u2013]/g, '-').replace(/,/g, '').replace(/^[a-zA-Z]\s*=\s*/, '').replace(/^\$/, '').replace(/°$/, '').replace(/\s*(i|feet|foot|ft|inches|inch|in|seconds|second|sec|s|units|degrees|dollars|ounces)\.?$/i, '').trim();
  if (/^-?\d*\.?\d+$/.test(s) || /^-?\d+\.$/.test(s)) return parseFloat(s);
  const m = /^(-?\d+)\s*\/\s*(\d+)$/.exec(s); if (m && +m[2]) return +m[1] / +m[2];
  const mx = /^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/.exec(s); if (mx && +mx[3]) return Math.sign(+mx[1] || 1) * (Math.abs(+mx[1]) + +mx[2] / +mx[3]);
  return null;
}
function grade(p, a) {
  if (!answered(p, a)) return false;
  if (p.type === 'mc') return !!(p.choices[a] && p.choices[a].ok);
  if (p.type === 'multi') { const want = p.choices.map((c, i) => c.ok ? i : -1).filter(i => i >= 0).sort().join(','); return a.slice().sort().join(',') === want; }
  if (p.type === 'num') { const v = parseNum(a); return v !== null && Math.abs(v - p.answer) <= (p.tol || 1e-6); }
  if (p.type === 'match') return p.rows.every((r, i) => a[i] === r.ans);
  if (p.type === 'plot') return p.plot.ans.every(q => a.some(z => z[0] === q[0] && z[1] === q[1])) && a.length === p.plot.n;
  return false;
}
function keyAnswer(p) {
  if (p.type === 'mc') return p.choices.findIndex(c => c.ok);
  if (p.type === 'multi') return p.choices.map((c, i) => c.ok ? i : -1).filter(i => i >= 0);
  if (p.type === 'num') return G.ns(p.answer);
  if (p.type === 'match') return p.rows.map(r => r.ans);
  if (p.type === 'plot') return p.plot.ans.map(q => q.slice());
  return null;
}
function answerText(p) {
  if (p.type === 'mc') { const k = p.choices.findIndex(c => c.ok); return `${LET[k]}`; }
  if (p.type === 'multi') return p.choices.map((c, i) => c.ok ? LET[i] : null).filter(Boolean).join(', ');
  if (p.type === 'num') return `${p.pre ? Rp('`' + p.pre + '`') + ' ' : ''}${Rm(G.ns(p.answer))}${p.unit ? ' ' + p.unit : ''}`;
  if (p.type === 'match') return p.rows.map(r => p.opts[r.ans]).join(', ');
  if (p.type === 'plot') return Rp(p.answerText || p.plot.ans.map(q => '`(' + q[0] + ', ' + q[1] + ')`').join(', '));
  return '';
}
